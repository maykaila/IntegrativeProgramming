<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Financial Tracker</h1>
    </header>

    <main class="container">
        <!-- Top Metrics Row -->
        <section class="overview-grid">
            <div class="card balance-card">
                <h4>Total Balance</h4>
                <h1>₱2,450.00</h1>
            </div>

            <div class="card summary-box income">
                <h4>Total Income</h4>
                <p>+₱3,200.00</p>
            </div>

            <div class="card summary-box expense">
                <h4>Total Expenses</h4>
                <p>-₱750.00</p>
            </div>
        </section>

        <!-- Main Content (Two Columns) -->
        <section class="content-grid">
            <!-- Left Column: Transaction History -->
            <div class="card">
                <h3>Transaction History</h3>
                <ul class="transaction-list">
                    <li class="transaction-item income">
                        <span class="desc">Monthly Salary</span>
                        <span class="amount">+₱3,200.00</span>
                    </li>
                    <li class="transaction-item expense">
                        <span class="desc">Grocery Shopping</span>
                        <span class="amount">-₱150.00</span>
                    </li>
                    <li class="transaction-item expense">
                        <span class="desc">Electricity Bill</span>
                        <span class="amount">-₱100.00</span>
                    </li>
                    <li class="transaction-item expense">
                        <span class="desc">Internet Subscription</span>
                        <span class="amount">-₱500.00</span>
                    </li>
                </ul>
            </div>

            <!-- Right Column: Add Transaction Form -->
            <div class="card">
                <h3>Add New Transaction</h3>
                <form>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Enter description..." required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type">
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="amount">Amount (₱)</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Add Transaction</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
